name: PullRequest & Push master

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: merkaly-io/actions/setup@master

      - run: pnpm lint
        continue-on-error: true

      - run: pnpm prepack

      - uses: merkaly-io/actions/dependabot@master
        with:
          private-key: ${{ secrets.MERKALY_BOT_PRIVATE_KEY }}

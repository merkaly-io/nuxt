name: PullRequest & Push master

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, closed ] # closed only runs the cache cleanup

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: merkaly-io/actions/setup@master

      - run: pnpm lint
        continue-on-error: true

      - run: pnpm prepack

      - uses: merkaly-io/actions/dependabot@master
        with:
          private-key: ${{ secrets.MERKALY_BOT_PRIVATE_KEY }}

  cache:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: merkaly-io/actions/cache-cleanup@master # the PR merge ref caches are useless once closed
